name: Build Android App (APK & Play Store AAB)

on:
  push:
    branches: ["main", "feat/*"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML game script syntax
        run: |
          python3 -c 'import re; html = open("Beetal dash.html", encoding="utf-8").read(); m = re.findall(r"<script>([\s\S]*?)</script>", html); assert m, "Missing <script>"; open("/tmp/game_check.js", "w", encoding="utf-8").write(m[-1])'
          node --check /tmp/game_check.js

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and lint Debug APK
        run: gradle -p android :app:assembleDebug :app:lintDebug --no-daemon

      - name: Verify Debug APK contents
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/dung-beetle-dash-debug.apk
          unzip -l dist/dung-beetle-dash-debug.apk | tee /tmp/apk_contents.txt
          grep -q "assets/www/index.html" /tmp/apk_contents.txt
          grep -q "classes.dex" /tmp/apk_contents.txt

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dung-beetle-dash-debug-apk
          path: dist/dung-beetle-dash-debug.apk

      - name: Decode Play Store upload keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "${{ runner.temp }}/upload-keystore.jks"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Play Store AAB & Release APK
        if: ${{ steps.keystore.outputs.configured == 'true' }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android :app:bundleRelease :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp android/app/build/outputs/bundle/release/app-release.aab dist/dung-beetle-dash-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk dist/dung-beetle-dash-release.apk

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/upload-keystore.jks"

      - name: Upload Play Store Release artifacts
        if: ${{ steps.keystore.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dung-beetle-dash-play-release
          path: |
            dist/dung-beetle-dash-release.aab
            dist/dung-beetle-dash-release.apk

      - name: Publish GitHub Release on version tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi
